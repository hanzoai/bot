# Builds and pushes ghcr.io/hanzoai/bot-cloud from Dockerfile.cloud. Nothing else.
#
# This is .github/workflows/docker-cloud.yml moved here. The move is a rename;
# the body is not, because the body was one
# `uses: hanzoai/.github/.github/workflows/docker-build.yml@main` and a private
# cross-repo reusable workflow does not resolve on the forge. The amd64
# build/push it performed is vendored inline, the same way deploy.yml does — one
# shape for both images this repo publishes.
#
# Same paths filter as before: this image only changes when its Dockerfile or
# its entrypoint does.
#
# Nothing in hanzoai/universe references bot-cloud, so it has no App CR. See
# LLM.md.
name: cloud

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.cloud
      - docker/cloud-entrypoint.sh
      - .hanzo/workflows/cloud.yml
  workflow_dispatch:

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # The old runner-amd64 input asked for ["self-hosted","linux","amd64"]. The
    # forge's git-runner advertises all three, and hanzo-build-linux-amd64, and
    # maps them to the same job image — so this label answers either way.
    runs-on: [hanzo-build-linux-amd64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: tags
        run: |
          set -euo pipefail
          image=ghcr.io/hanzoai/bot-cloud
          {
            echo 'list<<EOF'
            echo "${image}:sha-$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
            echo "${image}:latest"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3
        with: { driver: docker-container, driver-opts: network=host }

      # Without this the push is unauthenticated and 403s at the registry.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cloud
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}

      # build-push-action can exit 0 before the manifest resolves, so a green run
      # could still mean a future ImagePullBackOff. Prove it pulls.
      - name: the pushed image resolves
        run: |
          set -euo pipefail
          # QUOTED, and iterated line-by-line. steps.tags.outputs.list is a
          # newline-delimited heredoc (that is the shape docker/build-push-action
          # wants for `tags:`), so an UNQUOTED `for img in ${{ … }}` pastes a raw
          # newline into the command and bash dies with
          #   syntax error near unexpected token `ghcr.io/hanzoai/<repo>:latest'
          # It only breaks when there are TWO tags, so branch builds pass and the
          # v-tag/main builds that actually publish :latest are the ones that fail
          # — AFTER the image has already been built and pushed.
          printf '%s\n' "${{ steps.tags.outputs.list }}" | while read -r img; do
            [ -n "${img}" ] || continue
            for i in 1 2 3 4 5 6; do
              if docker buildx imagetools inspect "${img}" >/dev/null 2>&1; then
                echo "resolved ${img}"
                break
              fi
              if [ "${i}" = 6 ]; then
                echo "::error::pushed image never resolved: ${img}"
                exit 1
              fi
              sleep 5
            done
          done
