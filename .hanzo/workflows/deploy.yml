# Build the image and push it. Nothing else.
#
# An earlier version called buildctl-daemonless.sh, which does not exist in the
# job image (catthehacker/ubuntu:act-24.04, per GIT_RUNNER_LABELS) — exit 127 —
# and read secrets.GIT_CLONE_TOKEN, which exists on neither the repo nor the
# hanzoai org. It had never produced an image.
#
# What replaced it still could not: the Dockerfile asserts
# dist/control-ui/index.html exists (ARG REQUIRE_ADMIN_UI=1), dist/control-ui is
# gitignored with nothing tracked under it, and no step assembled it. Every run
# would have failed at that assertion. The assembly is restored below from
# .github/workflows/docker-release.yml, which is where it lived and which was
# deleted; the local build context is what makes it visible to the build.
#
# No deploy step on purpose: kubectl is absent from the job image too, and a
# CI-side patch is reverted within minutes by cd.hanzo.ai's selfHeal, which
# restores the App CR from the reviewed pin in hanzoai/universe. CI's job ends
# at "the tag exists and resolves"; choosing which tag runs is a reviewed change.
#
# This matters more than it used to: actions-runner-controller was decommissioned,
# so this pipeline is now the only CI this repo has.
name: deploy

on:
  push:
    branches: [main, dev, test]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-bot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Must name a label a runner ACTUALLY advertises. The git-runners offer
    # hanzo-build-linux-amd64; a label nothing offers does not fail, it queues
    # until the 24h timeout — silence, not an error.
    runs-on: [hanzo-build-linux-amd64]
    # 180, not 60. This publishes both architectures now, and the arm64 half is
    # emulated on this amd64 pool, so the wall time roughly triples. The old cap
    # would have killed the run after the amd64 half had already been built and
    # thrown away -- build-push-action pushes nothing until every platform is
    # done, so a timeout here costs the amd64 image too.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Computed in shell so there are no action semantics to guess at.
      #   v* tag            -> :X.Y.Z + :latest   (this is what a CR pins)
      #   main push         -> :sha-<sha7> + :latest
      #   dev / test push   -> :sha-<sha7> only, so :latest keeps meaning main
      - id: tags
        run: |
          set -euo pipefail
          image=ghcr.io/hanzoai/bot
          case "${GITHUB_REF}" in
            refs/tags/v*)     primary="${image}:${GITHUB_REF#refs/tags/v}"; floating=1 ;;
            refs/heads/main)  primary="${image}:sha-$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"; floating=1 ;;
            *)                primary="${image}:sha-$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"; floating=0 ;;
          esac
          {
            echo 'list<<EOF'
            echo "${primary}"
            if [ "${floating}" = 1 ]; then echo "${image}:latest"; fi
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"
          echo "publishing ${primary}"
          if [ "${floating}" = 1 ]; then echo "publishing ${image}:latest"; fi

      # The gateway serves the @hanzo/bot-admin SPA out of dist/control-ui/, and
      # the Dockerfile fails the build when it is absent. The SPA source lives in
      # the private hanzoai/admin bun workspace (apps/bot), so it is built
      # here and synced into the context before buildx reads it. GH_PAT is what
      # reaches that private repo; without it this step fails loudly rather than
      # producing an image with every admin route 404ing.
      #
      # apps/bot, not apps/admin-bot: hanzoai/admin 56bc1990 dropped the
      # redundant prefix from every directory under apps/ — the workspace is
      # already the admin — and this path was left pointing at the old name.
      # bun install succeeded, the cd did not, and no image has been built
      # since.
      - name: build the admin-bot SPA into dist/control-ui
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::GH_PAT is unset, so the private hanzoai/admin SPA cannot be built. Add the forge secret."
            exit 1
          fi
          git clone --depth=1 --branch=main \
            "https://x-access-token:${GH_PAT}@github.com/hanzoai/admin.git" \
            /tmp/hanzoai-admin
          if ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash
            export PATH="${HOME}/.bun/bin:${PATH}"
          fi
          cd /tmp/hanzoai-admin
          bun install --frozen-lockfile
          cd apps/bot
          bun run build
          cd "${GITHUB_WORKSPACE}"
          ADMIN_BOT_DIR=/tmp/hanzoai-admin/apps/bot bash scripts/sync-admin-ui.sh
          test -f dist/control-ui/index.html

      # binfmt, so an aarch64 RUN can execute on this x86 host. Every layer of
      # this Dockerfile is a RUN -- apt, corepack, pnpm install, pnpm build --
      # so without it the arm64 half dies on the first one.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        with: { driver: docker-container, driver-opts: network=host }

      # Without this the push is unauthenticated and 403s at the registry.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      # context: . — a local context, so the SPA assembled above is in the build.
      # A remote git context would not see it. REQUIRE_ADMIN_UI keeps its default
      # of 1, so a silently missing SPA still fails the build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # The lab runs amd64 (evo) and arm64 (spark), so a single-arch image
          # deploys on half of it. The base is pinned by digest --
          # node:22-bookworm@sha256:cd7bcd2e... -- and that digest is an index
          # carrying linux/arm64v8, so both halves resolve from the one pin.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}

      # build-push-action can exit 0 before the manifest resolves, so a green run
      # could still mean a future ImagePullBackOff. Prove it pulls.
      - name: the pushed image resolves
        run: |
          set -euo pipefail
          # QUOTED, and iterated line-by-line. steps.tags.outputs.list is a
          # newline-delimited heredoc (that is the shape docker/build-push-action
          # wants for `tags:`), so an UNQUOTED `for img in ${{ … }}` pastes a raw
          # newline into the command and bash dies with
          #   syntax error near unexpected token `ghcr.io/hanzoai/<repo>:latest'
          # It only breaks when there are TWO tags, so branch builds pass and the
          # v-tag/main builds that actually publish :latest are the ones that fail
          # — AFTER the image has already been built and pushed.
          printf '%s\n' "${{ steps.tags.outputs.list }}" | while read -r img; do
            [ -n "${img}" ] || continue
            for i in 1 2 3 4 5 6; do
              if docker buildx imagetools inspect "${img}" >/dev/null 2>&1; then
                echo "resolved ${img}"
                break
              fi
              if [ "${i}" = 6 ]; then
                echo "::error::pushed image never resolved: ${img}"
                exit 1
              fi
              sleep 5
            done
          done
