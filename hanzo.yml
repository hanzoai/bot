# Canonical CI config for hanzoai/bot — read by the hanzoai/ci reusable
# (.github/workflows/cicd.yml) and by platform.hanzo.ai.
#
# This repo has never had one, and that — not a missing recipe — is why no box
# image exists anywhere in the org. Dockerfile.sandbox and its two siblings have
# been correct and unbuilt for months, reachable only through
# scripts/sandbox-*-setup.sh on somebody's laptop. A recipe nobody builds is a
# recipe nobody can deploy.

# ONE Dockerfile, THREE tags, one chain: exec -> dev -> desktop.
#
# hanzoai/ci's image lane has no `target:` field — it runs
# `docker buildx build -f "$df" "$ctx"`, which builds the LAST stage. So
# Dockerfile.box ends with `FROM ${STAGE} AS final`, an alias, and the class is
# selected here. BuildKit only builds the stages the target depends on, so
# STAGE=exec never installs a browser, and the local builder passes the same arg
# — one selection mechanism, not one for CI and one for a laptop.
#
# `tag-suffix` is what makes three entries share one repo: the tags come out as
# sandbox:sha-<short>-exec / -dev / -desktop, and a deployment pins the digest.
#
# THE REPO IS hanzoai/sandbox, NOT hanzoai/box, BECAUSE A CONSUMER NAMES IT.
# hanzoai/cloud apps/sandbox/runtime.go defaults SANDBOX_IMAGE_REPO to
# `registry.hanzo.ai/hanzoai/sandbox` and builds `<repo>:<class>[-<tag>]` from
# it. An image path is only correct relative to who pulls it, and nothing pulls
# `hanzoai/box`: the daemon design that owned that name was deleted from cloud
# along with cmd/boxd. One artifact, one path, named by the thing that fetches it.
#
# MULTI-ARCH NOW, AND THE BLOCKER IS GONE RATHER THAN WAIVED. This lane was
# amd64-only for a specific reason, written here: the image did
# `COPY --from=<cloud release> /boxd`, and cloud's image lane publishes
# linux/amd64 only, so there was no arm64 manifest to copy a binary out of.
# That COPY no longer exists — there is no daemon to carry — so this image's
# inputs are now its own base and its own tarballs, every one of which
# publishes both arches (verified). DOKS still has no arm64 node, so this buys
# nothing on the current fleet; it costs a QEMU-emulated second build and it
# means an arm64 node (or a developer's laptop) is a scheduling decision rather
# than a rebuild.
images:
  - name: sandbox-exec
    context: .
    dockerfile: Dockerfile.box
    repo: registry.hanzo.ai/hanzoai/sandbox
    tag-suffix: exec
    platforms: [linux/amd64, linux/arm64]
    args: { STAGE: exec }

  - name: sandbox-dev
    context: .
    dockerfile: Dockerfile.box
    repo: registry.hanzo.ai/hanzoai/sandbox
    tag-suffix: dev
    platforms: [linux/amd64, linux/arm64]
    args: { STAGE: dev }

  - name: sandbox-desktop
    context: .
    dockerfile: Dockerfile.box
    repo: registry.hanzo.ai/hanzoai/sandbox
    tag-suffix: desktop
    platforms: [linux/amd64, linux/arm64]
    args: { STAGE: desktop }

# The gate for THIS lane, and deliberately not a second copy of ci.yml.
#
# `.hanzo/workflows/ci.yml` already runs `pnpm check`, the build, the docs check
# and the full vitest matrix on every push. Repeating any of it here would double
# the wall time of every commit to buy nothing. What ci.yml does NOT know about
# is the image this lane exists to publish, so the gate is exactly the assertion
# that guards it: the box's bases stay pinned, and every FROM in Dockerfile.box
# resolves to a stage or an ARG declared in the same file.
test:
  - pnpm install --frozen-lockfile
  - pnpm exec vitest run src/docker-image-digests.test.ts
