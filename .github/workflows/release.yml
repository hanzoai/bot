name: Release

# hanzoai/bot is the ops/orchestration repo. The npm @hanzo/bot package
# publishes from hanzobot/ts. This workflow only ships container images
# for the bits this repo actually owns (compose stack helpers, infra).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yml config --quiet
