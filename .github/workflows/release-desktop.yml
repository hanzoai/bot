name: Release Desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2026.6.11)"
        required: false
        default: "v2026.6.11"
      source_ref:
        description: "Private hanzo-inc/bot git ref to build"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Universal (.dmg)
            os: macos-15
            platform: macos
            arch_label: universal
            appimage_arch: universal
          - label: Windows x64 (.exe)
            os: windows-latest
            platform: windows
            arch_label: x64
            appimage_arch: x86_64
          - label: Linux amd64 (.AppImage + .deb)
            os: ubuntu-24.04
            platform: linux
            arch_label: amd64
            appimage_arch: x86_64
          - label: Linux arm64 (.AppImage + .deb)
            os: ubuntu-24.04-arm
            platform: linux
            arch_label: arm64
            appimage_arch: aarch64
    steps:
      - name: Resolve release version
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REF: ${{ inputs.source_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v*) VER="${TAG#v}" ;;
            *) TAG="v2026.6.10"; VER="2026.6.10" ;;
          esac
          SRC_REF="${INPUT_REF:-main}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${SRC_REF}" >> "$GITHUB_OUTPUT"

      - name: Install Linux Tauri v2 & AppImage packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools \
            desktop-file-utils \
            libfuse2t64 || sudo apt-get install -y libfuse2

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'macos'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'windows'
        with:
          targets: x86_64-pc-windows-msvc

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'linux'

      - name: Clone private @hanzo/bot-desktop source via Hanzo KMS
        shell: bash
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          FALLBACK_GH_PAT: ${{ secrets.GH_PAT }}
          FALLBACK_HANZO_GIT_TOKEN: ${{ secrets.HANZO_GIT_TOKEN }}
          FALLBACK_GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          SOURCE_REF: ${{ steps.ver.outputs.source_ref }}
        run: |
          set -uo pipefail
          field() { sed -n 's/.*"'"$1"'"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1; }
          tok=""

          if [ -n "${KMS_CLIENT_ID:-}" ] && [ -n "${KMS_CLIENT_SECRET:-}" ]; then
            for endpoint in "https://kms.hanzo.ai" "https://api.hanzo.ai"; do
              kms_json="$(mktemp)"
              code="$(curl -sS -o "$kms_json" -w '%{http_code}' "${endpoint}/v1/kms/auth/login" \
                -H 'Content-Type: application/json' \
                -d "{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}" || echo 000)"
              if [ "$code" = "200" ]; then
                access_tok="$(field accessToken < "$kms_json")"
                rm -f "$kms_json"
                if [ -n "$access_tok" ]; then
                  echo "::add-mask::${access_tok}"
                  for path in "secrets/deploy/GITHUB_TOKEN" "secrets/GITHUB_TOKEN" "orgs/hanzo/secrets/GITHUB_TOKEN"; do
                    sec_json="$(mktemp)"
                    sc="$(curl -sS -o "$sec_json" -w '%{http_code}' "${endpoint}/v1/kms/${path}?env=prod" \
                      -H "Authorization: Bearer ${access_tok}" || echo 000)"
                    if [ "$sc" = "200" ]; then
                      cand="$(field value < "$sec_json")"
                      rm -f "$sec_json"
                      if [ -n "$cand" ]; then
                        echo "::add-mask::${cand}"
                        check_code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${cand}" https://api.github.com/repos/hanzo-inc/bot || echo 000)"
                        if [ "$check_code" = "200" ]; then
                          tok="$cand"
                          echo "Authenticated private source access via KMS (${path})"
                          break 2
                        fi
                      fi
                    else
                      rm -f "$sec_json"
                    fi
                  done
                fi
              else
                rm -f "$kms_json"
              fi
            done
          fi

          if [ -z "$tok" ]; then
            for cand in "${FALLBACK_GH_PAT:-}" "${FALLBACK_HANZO_GIT_TOKEN:-}" "${FALLBACK_GIT_TOKEN:-}"; do
              if [ -n "$cand" ]; then
                echo "::add-mask::${cand}"
                check_code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${cand}" https://api.github.com/repos/hanzo-inc/bot || echo 000)"
                if [ "$check_code" = "200" ]; then
                  tok="$cand"
                  echo "Authenticated private source access via organization token"
                  break
                fi
              fi
            done
          fi

          if [ -z "$tok" ]; then
            echo "::error::Unable to obtain a token with read access to private hanzo-inc/bot"
            exit 1
          fi

          echo "::add-mask::${tok}"
          auth_b64="$(printf 'x-access-token:%s' "$tok" | base64 | tr -d '\r\n')"
          echo "::add-mask::${auth_b64}"

          rm -rf "$RUNNER_TEMP/bot-src"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_b64}" \
            clone --depth 1 --branch "$SOURCE_REF" https://github.com/hanzo-inc/bot.git "$RUNNER_TEMP/bot-src"
          git -C "$RUNNER_TEMP/bot-src" log -1 --oneline

      - name: Stamp version & build @hanzo/bot-web + @hanzo/bot-desktop staged resources
        shell: bash
        env:
          DESKTOP_VERSION: ${{ steps.ver.outputs.version }}
          DATABASE_URL: postgres://hanzo_bot:hanzo_bot@127.0.0.1:5433/hanzo_bot
          HANZO_BOT_ALLOW_DEV_SECRETS: "1"
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bot-src"
          node -e '
            const fs = require("node:fs");
            const ver = process.env.DESKTOP_VERSION;
            const pkgPath = "apps/desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = ver;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

            const confPath = "apps/desktop/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
            conf.version = ver;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");

            const cargoPath = "apps/desktop/src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8").replace(/^version\s*=\s*"[^"]+"/m, `version = "${ver}"`);
            fs.writeFileSync(cargoPath, cargo);
          '
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @hanzo/bot-web build
          pnpm --filter @hanzo/bot-desktop build

      - name: Package macOS Universal Tauri v2 (.dmg)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          DESKTOP_VERSION: ${{ steps.ver.outputs.version }}
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bot-src/apps/desktop/src-tauri"
          CFG=$(jq -cn --arg v "$DESKTOP_VERSION" '{version: $v, build: {beforeBuildCommand: ""}}')
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app,dmg --config "$CFG" || \
            npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app --config "$CFG"

          APP_PATH="target/universal-apple-darwin/release/bundle/macos/Hanzo Bot.app"
          codesign --force --deep --sign - --entitlements ../assets/entitlements.mac.plist "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          mkdir -p "$GITHUB_WORKSPACE/dist-release"
          STAGE_DIR=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create -volname "Hanzo Bot" -srcfolder "$STAGE_DIR" -ov -format UDZO "$GITHUB_WORKSPACE/dist-release/Hanzo_Bot_${DESKTOP_VERSION}_universal.dmg"
          rm -rf "$STAGE_DIR"
          cp "$GITHUB_WORKSPACE/dist-release/Hanzo_Bot_${DESKTOP_VERSION}_universal.dmg" "$GITHUB_WORKSPACE/dist-release/hanzo-bot-macos.dmg"
          ls -lh "$GITHUB_WORKSPACE/dist-release/"

      - name: Package Windows x64 Tauri v2 NSIS (.exe)
        if: matrix.platform == 'windows'
        shell: bash
        env:
          DESKTOP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bot-src/apps/desktop/src-tauri"
          CFG=$(jq -cn --arg v "$DESKTOP_VERSION" '{version: $v, build: {beforeBuildCommand: ""}}')
          npx --yes @tauri-apps/cli@2 build --bundles nsis --config "$CFG"

          mkdir -p "$GITHUB_WORKSPACE/dist-release"
          EXE_FOUND="$(find target/release/bundle/nsis -maxdepth 1 -name "*-setup.exe" | head -n 1)"
          cp "$EXE_FOUND" "$GITHUB_WORKSPACE/dist-release/hanzo-bot-windows-x64-setup.exe"
          cp "$EXE_FOUND" "$GITHUB_WORKSPACE/dist-release/Hanzo_Bot_${DESKTOP_VERSION}_x64-setup.exe"
          cp "$EXE_FOUND" "$GITHUB_WORKSPACE/dist-release/Hanzo.Bot_${DESKTOP_VERSION}_x64-setup.exe"
          ls -lh "$GITHUB_WORKSPACE/dist-release/"

      - name: Package Linux (${{ matrix.arch_label }}) Tauri v2 (.AppImage & .deb)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          DESKTOP_VERSION: ${{ steps.ver.outputs.version }}
          ARCH_LABEL: ${{ matrix.arch_label }}
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bot-src/apps/desktop/src-tauri"
          CFG=$(jq -cn --arg v "$DESKTOP_VERSION" '{version: $v, build: {beforeBuildCommand: ""}}')
          npx --yes @tauri-apps/cli@2 build --bundles deb --config "$CFG"
          npx --yes @tauri-apps/cli@2 build --bundles appimage --config "$CFG" || true

          mkdir -p "$GITHUB_WORKSPACE/dist-release"
          DEB_FOUND="$(find target/release/bundle/deb -maxdepth 1 -name "*.deb" | head -n 1)"
          cp "$DEB_FOUND" "$GITHUB_WORKSPACE/dist-release/Hanzo_Bot_${DESKTOP_VERSION}_${ARCH_LABEL}.deb"
          cp "$DEB_FOUND" "$GITHUB_WORKSPACE/dist-release/hanzo-bot-linux-${ARCH_LABEL}.deb"

          APPIMG_FOUND="$(find target/release/bundle/appimage -maxdepth 1 -name "*.AppImage" | head -n 1 || true)"
          if [ -z "$APPIMG_FOUND" ] || [ ! -f "$APPIMG_FOUND" ]; then
            APPDIR="$(mktemp -d)/HanzoBot.AppDir"
            mkdir -p "$APPDIR"
            dpkg-deb -x "$DEB_FOUND" "$APPDIR"
            cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/lib/x86_64-linux-gnu:$HERE/usr/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH:-}"
          exec "$HERE/usr/bin/hanzo-bot" "$@"
          APPRUN
            sed -i 's/^          //' "$APPDIR/AppRun"
            chmod +x "$APPDIR/AppRun"
            DESKTOP_FILE="$(find "$APPDIR/usr/share/applications" -name "*.desktop" | head -n 1)"
            cp "$DESKTOP_FILE" "$APPDIR/"
            cp icons/icon.png "$APPDIR/hanzo-bot.png"
            cp icons/icon.png "$APPDIR/.DirIcon"
            curl -fsSL -o /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage"
            chmod +x /tmp/appimagetool
            ARCH="$APPIMAGE_ARCH" APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool "$APPDIR" "$GITHUB_WORKSPACE/dist-release/hanzo-bot-linux-${ARCH_LABEL}.AppImage"
          else
            cp "$APPIMG_FOUND" "$GITHUB_WORKSPACE/dist-release/hanzo-bot-linux-${ARCH_LABEL}.AppImage"
          fi
          chmod +x "$GITHUB_WORKSPACE/dist-release/hanzo-bot-linux-${ARCH_LABEL}.AppImage"
          cp "$GITHUB_WORKSPACE/dist-release/hanzo-bot-linux-${ARCH_LABEL}.AppImage" "$GITHUB_WORKSPACE/dist-release/Hanzo_Bot_${DESKTOP_VERSION}_${ARCH_LABEL}.AppImage"
          if [ "$ARCH_LABEL" = "amd64" ]; then
            cp "$GITHUB_WORKSPACE/dist-release/hanzo-bot-linux-amd64.AppImage" "$GITHUB_WORKSPACE/dist-release/hanzo-bot-linux-x86_64.AppImage"
          fi
          ls -lh "$GITHUB_WORKSPACE/dist-release/"

      - name: Purge temporary private checkout
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/bot-src"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch_label }}
          path: dist-release/*
          if-no-files-found: error

  publish-release:
    name: Publish Binary Release
    needs: [build-desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve tag
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) TAG="v2026.6.10" ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS and publish binary-only release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          (
            cd artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )
          ls -lh artifacts/
          NOTES="Hanzo Bot ${TAG} native Rust Tauri v2 desktop binary release (@hanzo/bot-desktop) for macOS Universal (.dmg), Windows x64 (.exe), Linux amd64 (.AppImage & .deb), and Linux arm64 (.AppImage & .deb) with zero Electron, built-in local PostgreSQL + Node stack, Hanzo IAM login, local hanzod integration, and canonical 836/1024 Apple-HIG Dock visor icon."
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber -R "$REPO"
            gh release edit "$TAG" --title "Hanzo Bot ${TAG}" --notes "$NOTES" --latest -R "$REPO"
          else
            gh release create "$TAG" artifacts/* --title "Hanzo Bot ${TAG}" --notes "$NOTES" --latest -R "$REPO"
          fi
