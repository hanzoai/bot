<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" role="img" aria-label="Pixel runbook">
  <rect width="16" height="16" fill="none"/>
  <!-- page outline -->
  <rect x="3" y="1" width="10" height="14" fill="#3a0a0d"/>
  <!-- page -->
  <rect x="4" y="2" width="8" height="12" fill="#ff4f40"/>
  <!-- step lines -->
  <g fill="#3a0a0d">
    <rect x="5" y="4" width="6" height="1"/>
    <rect x="5" y="6" width="6" height="1"/>
    <rect x="5" y="8" width="6" height="1"/>
    <rect x="5" y="10" width="4" height="1"/>
  </g>
  <!-- approval check -->
  <g fill="#f5fbff">
    <rect x="9" y="11" width="1" height="1"/>
    <rect x="10" y="10" width="1" height="1"/>
    <rect x="11" y="9" width="1" height="1"/>
  </g>
</svg>
