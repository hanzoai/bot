parent_config: ../../config/swiftlint.yml

included:
  - Sources
  - ShareExtension
  - ActivityWidget
  - WatchApp
  - ../shared/BotKit/Sources/BotChatUI
  - ../shared/BotKit/Sources/BotKit
  - ../shared/BotKit/Sources/BotNativeState
  - ../shared/BotKit/Sources/BotProtocol
  - ../swabble/Sources/SwabbleKit

excluded:
  - ../macos
  - ../macos-mlx-tts
  - ../shared/BotKit/Sources/BotProtocol/GatewayModels.swift

type_body_length:
  warning: 900
  error: 1300

custom_rules:
  bot_design_colors:
    name: "Bot design colors"
    excluded:
      - Sources/Design/BotBrand.swift
      - ../shared/BotKit/Sources/BotChatUI/ChatTheme.swift
    regex: '(Color\.accentColor|(^|[^A-Za-z0-9_])\.accentColor\b|Color\.(red|green|orange|cyan|blue|yellow|purple|pink)\b|\.(foregroundStyle|tint|fill|stroke|strokeBorder|background)\(\s*\.(red|green|orange|cyan|blue|yellow|purple|pink)\b|Color\(red:\s*0\s*/\s*255\.0,\s*green:\s*122\s*/\s*255\.0,\s*blue:\s*255\s*/\s*255\.0\))'
    message: "Use BotBrand or BotChatTheme design tokens instead of raw accent/status colors."
    severity: error
